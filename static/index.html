<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASTERS — Cote Reprise</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial,sans-serif;color:#222}header{background:#050505;padding:18px 14px;text-align:center;border-bottom:5px solid #d7b63a}.concession{color:#fff;font-size:32px;font-weight:900;letter-spacing:2px}.subtitle-head{color:#d7b63a;font-size:14px;font-weight:bold;margin-top:8px;letter-spacing:3px}main{max-width:900px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 3px 14px #0002}h1{margin:0 0 5px;font-size:27px}h2{margin:0 0 18px;font-size:21px}.subtitle{color:#666;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-weight:bold;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #ccc;border-radius:9px;font-size:17px}button{width:100%;padding:16px;border:0;border-radius:10px;background:#d71920;color:#fff;font-size:17px;font-weight:bold;margin-top:18px;cursor:pointer}.center{text-align:center}.big{font-size:42px;font-weight:900;margin:6px 0 15px}.green{color:#087443}.red{color:#d71920}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:11px 0}.small{font-size:13px;color:#666}.comp{padding:14px 0;border-bottom:1px solid #eee}.comp:last-child{border-bottom:0}.msg{padding:13px;background:#fff8d6;border-left:4px solid #d7b63a;margin-top:14px;border-radius:4px}.badge{display:inline-block;background:#000;color:#d7b63a;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:15px}a{color:#b40000;font-weight:bold;text-decoration:none}.dica{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:16px;text-align:left}.dica-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.dica-title{font-weight:900}.dica-item{padding:12px 0;border-top:1px solid #eee}.dica-item:first-child{border-top:0}.muted{color:#666}.pill{font-size:12px;padding:5px 8px;border-radius:12px;background:#f1f1f1}.warning{background:#fff8d6;padding:12px;border-radius:8px;margin-top:12px;color:#555}@media(max-width:600px){.grid{grid-template-columns:1fr}.big{font-size:36px}.concession{font-size:27px}.dica-head{align-items:flex-start;flex-direction:column}}.print-only{display:none}@media print{body{background:#fff}.no-print{display:none!important}.print-only{display:block}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:1px solid #ddd}} </style></head><body><header><div class="concession">MASTERS QUÉVEN</div><div class="subtitle-head">COTE REPRISE</div></header><main><div class="card"><div class="badge">COTE REPRISE MASTERS</div><h1>Évaluer un camping-car</h1><div class="subtitle">Recherche des annonces actuelles, comparaison du marché et contrôle par la cote DICA.</div><div class="grid"><div><label for="brand">Marque</label><input id="brand" placeholder="Ex. Chausson" value="Chausson"></div><div><label for="model">Modèle exact</label><input id="model" placeholder="Ex. 640" value="640"></div><div><label for="year">Année</label><input id="year" type="number" value="2022"></div><div><label for="km">Kilométrage</label><input id="km" type="number" value="25000"></div></div><button onclick="go()">RECHERCHER LE MARCHÉ ACTUEL</button><div id="status" class="msg" style="display:none"></div></div><div id="out"></div></main><script>async function go(){const status=document.getElementById('status');status.style.display='block';status.textContent='Recherche et synthèse des annonces en cours…';const body={brand:document.getElementById('brand').value,model:document.getElementById('model').value,year:document.getElementById('year').value,km:document.getElementById('km').value};try{const r=await fetch('/api/cote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');if(d.status==='insufficient')status.textContent=d.message;else status.style.display='none';render(d)}catch(e){status.textContent='Impossible de joindre le moteur de recherche : '+e.message}}function euro(n){return Number(n||0).toLocaleString('fr-FR')+' €'}function formatDate(s){try{return new Date(s).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return s||''}}function newSearch(){document.getElementById('out').innerHTML='';document.getElementById('status').style.display='none';document.getElementById('brand').focus();window.scrollTo({top:0,behavior:'smooth'})}function render(d){let h='';if(d.status==='ok'){h+='<div class="card center no-print"><div class="small">COTE MARCHÉ ACTUELLE</div><div class="big green">'+euro(d.market)+'</div><div class="row"><span>Fourchette observée</span><b>'+euro(d.market_low)+' – '+euro(d.market_high)+'</b></div><div class="row"><span>Comparables retenus</span><b>'+d.count+'</b></div><div class="row"><span>Fiabilité</span><b>'+d.confidence+'</b></div><div class="small" style="margin-top:12px">Recherche effectuée le '+formatDate(d.search_time)+'</div><button onclick="newSearch()">↻ NOUVELLE ÉVALUATION</button><button onclick="window.print()" style="background:#333">🖨 IMPRIMER L’ÉVALUATION</button></div><div class="card print-only"><div class="badge">MASTERS QUÉVEN · COTE MARCHÉ</div><h1>'+document.getElementById('brand').value+' '+document.getElementById('model').value+'</h1><div class="small">Année : '+document.getElementById('year').value+' · Kilométrage : '+Number(document.getElementById('km').value).toLocaleString('fr-FR')+' km</div><div class="big green">'+euro(d.market)+'</div><div>Fourchette observée : <b>'+euro(d.market_low)+' – '+euro(d.market_high)+'</b></div><div>Comparables : <b>'+d.count+'</b> · Fiabilité : <b>'+d.confidence+'</b></div><div class="small" style="margin-top:12px">Recherche effectuée le '+formatDate(d.search_time)+'</div></div>}else{h+='<div class="card"><h2>Résultat provisoire</h2><div class="warning">La recherche n’a pas trouvé assez de comparables fiables pour calculer une cote marché. Les annonces trouvées restent affichées ci-dessous.</div></div>'}if(d.dica&&d.dica.length){h+='<div class="card"><div class="dica"><div class="dica-head"><div class="dica-title">RÉFÉRENCE DICA</div><span class="pill">n°32 · janv.–avr. 2026</span></div><div class="small">Référence kilométrique : '+Number(d.dica_reference_km||d.dica[0].reference_km||0).toLocaleString('fr-FR')+' km</div><div class="small" style="margin-top:5px">La DICA est une référence indicative ; elle ne remplace pas l’observation du marché actuel.</div>';d.dica.slice(0,8).forEach(x=>{h+='<div class="dica-item"><b>'+x.gamme+'</b> — '+x.motorisation+'<br><span class="muted">Revente imprimée : '+euro(x.revente)+' · Reprise imprimée : '+euro(x.reprise)+'</span><br><b>Revente corrigée : '+euro(x.revente_corrigee)+'</b> · Reprise corrigée : <b>'+euro(x.reprise_corrigee)+'</b></div>'});h+='</div></div>'}else{h+='<div class="card"><h2>Référence DICA</h2><div class="warning">Aucune référence DICA n°32 correspondant exactement à cette marque, ce modèle et cette année n’a été retrouvée.</div></div>'}h+='<div class="card"><h2>Synthèse des annonces</h2>';(d.comparables||[]).forEach(x=>{h+='<div class="comp"><b>'+euro(x.price)+'</b> — '+(x.km!==null&&x.km!==undefined?Number(x.km).toLocaleString('fr-FR')+' km':'km non trouvé')+'<br><span class="small">'+(x.title||'')+'</span><br><span class="small">Ajustement km : '+(x.km_adjustment>=0?'+':'')+Number(x.km_adjustment||0).toLocaleString('fr-FR')+' € · Prix comparé : '+euro(x.adjusted)+'</span><br><a target="_blank" rel="noopener" href="'+x.url+'">Voir l’annonce</a></div>'});if(!(d.comparables||[]).length)h+='<div class="small">Aucune annonce suffisamment qualifiée n’a été retenue.</div>';h+='</div>';if((d.context||[]).length){h+='<div class="card"><h2>Annonces sans kilométrage</h2><div class="small" style="margin-bottom:8px">Conservées à titre de contexte ; elles ne pilotent pas la cote lorsqu’il existe suffisamment de comparables avec kilométrage.</div>';d.context.forEach(x=>{h+='<div class="comp"><b>'+euro(x.price)+'</b> — km non trouvé<br><span class="small">'+(x.title||'')+'</span><br><a target="_blank" rel="noopener" href="'+x.url+'">Voir l’annonce</a></div>'});h+='</div>'}document.getElementById('out').innerHTML=h}</script></body></html>

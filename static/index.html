<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASTERS — Cote Reprise</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f3f3f3;
font-family:Arial,sans-serif;
color:#222
}

header{
background:#050505;
padding:18px 14px;
text-align:center;
border-bottom:5px solid #d7b63a
}

.concession{
color:#fff;
font-size:32px;
font-weight:900;
letter-spacing:2px
}

.subtitle-head{
color:#d7b63a;
font-size:14px;
font-weight:bold;
margin-top:8px;
letter-spacing:3px
}

main{
max-width:820px;
margin:24px auto;
padding:0 16px
}

.card{
background:#fff;
border-radius:16px;
padding:22px;
margin-bottom:18px;
box-shadow:0 3px 14px #0002
}

h1{
margin:0 0 5px;
font-size:27px
}

h2{
margin:0 0 18px;
font-size:21px
}

.subtitle{
color:#666;
margin-bottom:20px
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px
}

label{
display:block;
font-weight:bold;
margin-bottom:7px
}

input{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:9px;
font-size:17px
}

button{
width:100%;
padding:16px;
border:0;
border-radius:10px;
background:#d71920;
color:#fff;
font-size:17px;
font-weight:bold;
margin-top:18px
}

.center{text-align:center}

.big{
font-size:42px;
font-weight:900;
margin:6px 0 15px
}

.green{color:#087443}
.red{color:#d71920}

.row{
display:flex;
justify-content:space-between;
border-bottom:1px solid #eee;
padding:11px 0
}

.small{
font-size:13px;
color:#666
}

.comp{
padding:14px 0;
border-bottom:1px solid #eee
}

.comp:last-child{
border-bottom:0
}

.msg{
padding:13px;
background:#fff8d6;
border-left:4px solid #d7b63a;
margin-top:14px;
border-radius:4px
}

.badge{
display:inline-block;
background:#000;
color:#d7b63a;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-bottom:15px
}

a{
color:#b40000;
font-weight:bold;
text-decoration:none
}

@media(max-width:600px){
.grid{
grid-template-columns:1fr
}

.big{
font-size:36px
}
}
</style>
</head>

<body>

<header>
<div class="concession">MASTERS QUÉVEN</div>
<div class="subtitle-head">COTE REPRISE</div>
</header>

<main>

<div class="card">

<div class="badge">COTE REPRISE MASTERS</div>

<h1>Évaluer un camping-car</h1>

<div class="subtitle">
Recherche des annonces actuelles et estimation de la cote marché.
</div>

<div class="grid">

<div>
<label for="brand">Marque</label>
<input id="brand" value="McLouis">
</div>

<div>
<label for="model">Modèle exact</label>
<input id="model" value="MC4 262">
</div>

<div>
<label for="year">Année</label>
<input id="year" type="number" value="2022">
</div>

<div>
<label for="km">Kilométrage</label>
<input id="km" type="number" value="25000">
</div>

</div>

<button onclick="go()">
RECHERCHER LE MARCHÉ ACTUEL
</button>

<div id="status" class="msg" style="display:none"></div>

</div>

<div id="out"></div>

</main>

<script>

async function go(){

const status=document.getElementById('status');

status.style.display='block';

status.textContent=
'Recherche et synthèse des annonces en cours…';

const body={
brand:document.getElementById('brand').value,
model:document.getElementById('model').value,
year:document.getElementById('year').value,
km:document.getElementById('km').value
};

try{

const r=await fetch('/api/cote',{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(body)
});

const d=await r.json();

if(!r.ok)
throw new Error(d.error||'Erreur');

if(d.status==='insufficient'){

status.textContent=d.message;

render(d);

return;

}

status.style.display='none';

render(d);

}

catch(e){

status.textContent=
'Impossible de joindre le moteur de recherche : '
+e.message;

}

}

function euro(n){

return Number(n).toLocaleString('fr-FR')+' €';

}

function render(d){

let h=

'<div class="card center">'+

'<div class="small">COTE MARCHÉ</div>'+

'<div class="big green">'+
euro(d.market)+
'</div>'+

'<div class="row">'+
'<span>Comparables retenus</span>'+
'<b>'+d.count+'</b>'+
'</div>'+

'<div class="row">'+
'<span>Fiabilité</span>'+
'<b>'+d.confidence+'</b>'+
'</div>'+

'<div class="small" style="margin-top:14px">'+
'− 8 000 € frais / marge Masters'+
'</div>'+

'<div class="small" style="margin-top:12px">'+
'REPRISE MASTERS'+
'</div>'+

'<div class="big red">'+
euro(d.trade)+
'</div>'+

'</div>';

h+=
'<div class="card">'+
'<h2>Synthèse des annonces</h2>';

(d.comparables||[]).forEach(x=>{

h+=

'<div class="comp">'+

'<b>'+
euro(x.price)+
'</b> — '+

(x.km?
Number(x.km).toLocaleString('fr-FR')+
' km':
'km non trouvé')+

'<br>'+

'<span class="small">'+
x.title+
'</span>'+

'<br>'+

'<a target="_blank" href="'+
x.url+
'">Voir l’annonce</a>'+

'</div>';

});

h+='</div>';

document.getElementById('out').innerHTML=h;

}

</script>

</body>
</html>
